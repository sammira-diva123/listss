<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha listinha pink 💖</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>🎀 Minha listinha</h1>
        <p class="subtitulo">Bora colocar a vida em ordem? 💅</p>

        <div class="adicionar">
            <input
                type="text"
                id="novaTarefa"
                placeholder="Digite uma tarefa..."
            >
            <button id="btnAdicionar">+</button>
        </div>

        <ul id="listaTarefas">
            <!-- As tarefas aparecem aqui -->
        </ul>

        <p class="rodape">Você consegue, diva! ✨</p>
    </div>

    <script src="js/script.js" defer></script>
</body>
</html>
